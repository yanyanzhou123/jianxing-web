9-d99030ed454bd4c0.js\",\"4726\",\"static/chunks/4726-d5f5d873b14655c9.js\",\"3312\",\"static/chunks/3312-023aade354f3f52f.js\",\"7780\",\"static/chunks/7780-035c612488da50be.js\",\"5180\",\"static/chunks/5180-635f8e224480d5c9.js\",\"1715\",\"static/chunks/1715-c9fe24977eb489d9.js\",\"4259\",\"static/chunks/4259-05cec03a6a42f591.js\",\"5204\",\"static/chunks/5204-3cf2aba7ad8c52c5.js\",\"6044\",\"static/chunks/6044-a22e0f8bc67fc51a.js\",\"3991\",\"static/chunks/app/course/%5Bslug%5D/%5Blesson%5D/page-426f54fc190d7780.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"2a:T61b4,"])</script><script>self.__next_f.push([1,"\u003cp\u003e这篇文章准备给大家介绍三个内容：第一是佛教和外道的差别；第二是世间法和出世间法的差别；第三是大乘和小乘的差别。\u003c/p\u003e\u003cp\u003e这三个问题说起来比较简单，但不一定人人都十分清楚。对一个想修持正法的人来说，就有必要先了解这三个问题的答案。因为，无论平时行善的时候也好、打坐的时候也好，对这三个问题的不同抉择会带来差异悬殊的结果，所以有必要讲一讲。\u003c/p\u003e\u003ch4\u003e一、外道和佛教的差别\u003c/h4\u003e\u003cp\u003e如果从广的角度来讲，外道和佛教的见解、修法、行为都不一样，最后获得的结果也有很大差别。但最关键的差别，就是皈依三宝的称为佛教，不愿皈依三宝并具有其他信仰的称为外道。\u003c/p\u003e\u003cp\u003e外道虽然也讲了一些空性，但是，他们讲不出缘起性空的空性。他们所讲的空性，只是一些很粗大的空性，不是现空无别的空性。比如说，有些外道也说，现在我们眼睛看到的、耳朵听见的那些东西是如幻如梦的。但是，他们讲的大部分空性，都是不承认现象的单空，这既非龙树菩萨等所讲的单空，也非无著菩萨等所讲的明空无别的空性。他们的空性就是根本不存在的东西，如同人的头上没有角之类的空性，佛教并不认为这是真正意义上的空性。外道讲的空性就是这么简单。\u003c/p\u003e\u003cp\u003e这是正规的外道，也就是释迦牟尼佛住世时那些外道的见解。后来伊斯兰教侵入印度，那烂陀寺和木扎莫西拉（戒香寺）等佛教最重要的基地被毁坏，有些佛教的教证、理证逐渐被一些外道吸收利用，所以，现在的外道经典里也掺杂了很多佛教的东西。但无论如何，迄今为止，没有一个外道能够抉择人无我以上的空性。\u003c/p\u003e\u003cp\u003e总之，佛教与外道最重要、最关键的差别就是：佛教是皈依三宝的，外道是不皈依三宝的。\u003c/p\u003e\u003cp\u003e所以，想学佛首先就必须皈依三宝。佛教并不要求所有的众生都皈依三宝，但如果要学佛、要修佛法，就要皈依三宝，不皈依三宝就是在门外、道外，就不能称之为佛教徒。\u003c/p\u003e\u003ch4\u003e二、世间法和出世间法的差别\u003c/h4\u003e\u003cp\u003e现在，无论是在汉地还是藏地，许多人都自诩为佛教徒、居士、出家人，经常放生、磕头、修五加行。很多人也以此而沾沾自喜，认为自己很不错，天天都在修法。但如果详细地观察他们为什么而修这些法，就会发现，有为数不少的人，其修法的目的只不过是为了自己现世的利益，如健康、长寿等，或为了消除一些寿障等现世的灾难。还有的是因惧怕三恶道（地狱、饿鬼、旁生道）的苦难，而希望自己下一世不堕恶趣，得到人天果报。凡具有以上这些发心的任何修法，都只能属于世间法。\u003c/p\u003e\u003cp\u003e我们不能以为烧香、磕头等是世间法，而听闻大中观或大圆满等就是出世间法。因为，世间法与出世间法并不是依外相而区分的。\u003c/p\u003e\u003cp\u003e比如向三宝供灯，在同样的供养对境、同样的供养物、同样的供养人的情况下，如果不具备出离心，供灯的发心是为了求得世间的圆满，为了健康长寿、升官发财，或者来世得到人天的福报，这样的供灯就是世间法；反之，如果具备了出离心，供灯的发心是为了求得解脱，而不是为了健康长寿、升官发财，这样的供灯就是出世间法。衡量世间法与出世间法，就是以是否具备出离心为标准的。\u003c/p\u003e\u003cp\u003e大圆满本身是出世间法，可是修大圆满或听大圆满的时候，由于发心的缘故，就有可能把它变成世间法。譬如说，仅仅为了得到一些现世或后世的利益而听大圆满或修大圆满，当此法进入我们的心相续时，它就不是出世间的法，更不是大乘的法。那是什么呢？就是世间法，这叫做“世间法的大圆满”。\u003c/p\u003e\u003cp\u003e放生是什么法呢？那也要看你的发心。即便不是为了得到现世的健康、长寿等，而是为了得到后世的人天果报，或是避免一些后世的灾难，如不堕地狱等三恶道而放生，这种放生也只能成为世间法；如果是为了自己一个人从轮回中得到解脱而放生，这种放生就成了出世间的小乘法；如果是为了拔济一切众生而发誓成佛，为了得到佛的果位而放生，这种放生就是大乘的出世间法；如果在此基础上有一些密宗的见解，这种放生就是密乘的法。\u003c/p\u003e\u003cp\u003e所以，我们一定要审慎思维，并反躬自问：我放生那么多年，到底是为了什么？是不是为了自利？如果是为了一切众生得到佛果而放生，那就可以成为大乘法；如果放生只是希望自己可以长寿，或者下一世转世为人并且健康长寿，或者自己往生净土的话，那这个放生看起来似乎是利益众生，实际上却是在利益自己。\u003c/p\u003e\u003cp\u003e其他修法也应当这样观察。比如到学院或是到其他地方去领受灌顶、听闻佛法，这是世间法还是出世间法呢？和前面讲的一样，如果只是为了自己的健康、长寿，或是为了逃避一些现世或后世身体和精神上的痛苦而听闻修持的话，就同样是世间法。为什么呢？因为你的目的没有离开世间的发心，所以在此基础上所建立的一切都是世间法。\u003c/p\u003e\u003cp\u003e什么叫做出世间法？世间法和出世间法的界限在哪里？出世间法包括大乘和小乘。即使小乘的修行，也必须要有出离心。有了真正的出离心，并在此基础上行善，这种修法就叫做出世间法。\u003c/p\u003e\u003cp\u003e“出离”这两个字的涵义是什么？“出”，就是要放下世间的一切。也就是说，要对世间的任何事物都不留恋，并很清楚地意识到三界六道轮回的痛苦本质，这叫做“出”；“离”就是希求解脱。“出家”中的“出”也是这层含义。“家”是指世间，并不是走出家门、穿上出家僧装就表示出家，而是要对轮回生起真正的厌离心。\u003c/p\u003e\u003cp\u003e在家人学佛、修出离心也是一样，就是要对世间的事物没有任何贪图之心，这叫做“出”。这个“出”外道也有，很多外道的出家人也不愿意在六道中轮回，也希望解脱，但这不叫出离心。真正的出离心，还必须要有一个正确的见解。正确的见解是什么呢？就是首先要意识到轮回的痛苦，所以不再留恋轮回，并努力去寻求解脱、走向解脱。但是，与此同时必须要有解脱的智慧。如果只是一味盲目地、没有智慧地寻求解脱，并不是完整的出离心。出离心的解脱智慧包括小乘的四谛法门，精通四谛之后，才算具备了完整的出离心。\u003c/p\u003e\u003cp\u003e具备了真实无伪的出离心后，所修的一切善法都将成为出世间的法。《俱舍论》里讲，从有了出离心以后，就算是小乘的入道。此处“入道”的意思是指进入小乘次第的第一步。\u003c/p\u003e\u003cp\u003e出离心很重要。人身难得、寿命无常、轮回是苦、因果不虚这些外加行，对增上出离心有很大的帮助。但现在很多所谓的佛教徒，却不愿意修加行，特别是人身难得、寿命无常这些外加行，直接就想修大圆满、大手印等法。这样的人，在藏地的出家人里也有，但在汉地的居士里更多。大圆满、大手印当然是很好的法，但我们现在是不是这样的根器呢？自己现在的心相续调整好了没有？如果没有调整好的话，那么大圆满、大手印是不可能修起来的。\u003c/p\u003e\u003cp\u003e调整的方法又是什么呢？就是修人身难得等修法。对这些修法，我们绝不能等闲视之。阿底峡尊者及以前藏地很多专门修行的高僧大德，他们非常重视人身难得和无常。前辈们已经为我们作出了最好的表率，我们就应当追随他们的足迹。那些不愿修加行，第一步就妄想迈得很高的人，他们离解脱的目的地，也就如同被重重关山阻隔一般，永久难以抵达。\u003c/p\u003e\u003cp\u003e曾经有一位大成就者，当他的一个弟子将要离开的时候，就到上师面前，祈请传一个更殊胜的窍诀。上师说：我并没有什么更殊胜的窍诀。弟子将所有的东西都供养了以后，再一次苦苦祈求，上师就握着弟子的手情真意切地说：“你也将会死的！我也将会死的！这个问题你回去好好思考。我的上师给我讲的也是这个法，我修的也就是这个法，我的上师也没有再给我讲什么，我也没有修过其他什么，这就是窍诀，你回去认真修持吧！”\u003c/p\u003e\u003cp\u003e说起来就是这么简单，你也会死，我也会死。这个不争的事实大家都知道，但是平时却似乎遗忘了。我们每一个人都要深入细致地思维一下这个修法，否则，什么结果也修不出来。\u003c/p\u003e\u003cp\u003e很多人都认为自己肯定在修出世间法，修的是五加行，这怎么不是出世间法呢？五加行本来是出世间的法，而且是大乘的法，但是，在你修持的当下，自相续中是以何等见解来修持的呢？虽然为现世的健康长寿等而修五加行的可能性比较小，但为了后世不堕地狱而修五加行的可能还是有的。如果没有寻求解脱的发心，修五加行也是世间法，而根本不是出世间法。这样一来，修五加行的意义也不是很大。念咒、磕大头是很累的，但如果修出来的不是密法，不是大乘法，也不是小乘法，而成了世间法，就非常令人惋惜。\u003c/p\u003e\u003cp\u003e不少人在法王如意宝前接受过灌顶，看过很多珍贵的书，这非常不容易。如果让它变成世间法，与解脱就没有什么关系了。以后即使会得到一些世间的福报，满足我们鼠目寸光的世间愿望，但与解脱却没有缘分，这岂不是很可惜吗？所以，一定要重视“人身难得”，不能白白地耗尽人生而不求解脱。欲求解脱，就一定要从出离心着手；如果没有出离心，修行也好、念咒也好，都不是获得解脱的出世间法，这个特别特别重要。在出离心的前提下才能讲菩提心，没有如理生起出离心，就不可能生起菩提心。\u003c/p\u003e\u003ch4\u003e三、大乘和小乘的差别\u003c/h4\u003e\u003cp\u003e大乘和小乘的区别是什么呢？就是有没有菩提心。\u003c/p\u003e\u003cp\u003e什么是菩提心？说起来很简单，每个人都会说：为了度化一切众生而发誓成佛，这就是菩提心。但是要付诸行动却并非易事，即使是修行多年的出家人，并自诩为是大圆满的瑜伽士或密法的修行者，有些人也没有真正生起出离心和菩提心。\u003c/p\u003e\u003cp\u003e阿底峡尊者在西藏时，有一次，他和他的弟子在用早餐的时候，尊者忽然说道：“今天，在印度的一个修喜金刚的修行者，已经堕入了声闻的灭定（灭定就是所有的粗分感受及思维都间断。从世间的角度来说，就是进入了一种很清净的状态，并在此状态中保持很长时间）。”尊者的弟子就说：“修喜金刚的行者，有可能堕入声闻的灭定吗？这是什么原因呢？”尊者说：“喜金刚本来是无上密法，但他没有修好，就成了小乘的法，从而堕入此灭定。”所以，判断是大乘的法还是小乘的法，是出世间的法还是世间的法，全都要看自己的发心如何，也就是最初修这些法的目的是什么。\u003c/p\u003e\u003cp\u003e比如说放生，表面上看这是一个利益众生的事，但很多人的希求仅仅是为了自己能避免一些痛苦，或是得到一些现世利益。这样的放生能不能达到其目的呢？目的能够达到。但是，这样的放生不属于大乘的法。因为，他实际上并没有真正利益众生，只是在利益自己而已。\u003c/p\u003e\u003cp\u003e很多人也在精勤不倦地修五加行，如果问他：“为什么修五加行呢？”他会回答说，“不修五加行，大圆满的正行就修不起来”或是“不修五加行，我就不能听大圆满的法”，“所以，我要修五加行”。表面上看来，这样的回答是对的。但如果继续追问：“如果修不成大圆满或听不到大圆满法，又会怎样呢？”“如果是这样，就不容易解脱了。”“解脱了又怎么样呢？”“解脱以后，我就没有痛苦、没有烦恼了。”\u003c/p\u003e\u003cp\u003e如果是这样的发心，则在这种修法里面根本没有菩提心的成分，五加行里所讲的菩提心又在哪里呢？你修的所谓菩提心，只不过是一个十万遍的数量而已，自己心相续中的菩提心却没有真实生起。虽然修的是发菩提心的法，但实际上却是为了自己而修，根本不是真正的菩提心修法。这样一来，你所修的五加行就成了小乘的修法，因为你的菩提心已经完全丧失。\u003c/p\u003e\u003cp\u003e所以，我们在修法的时候要认真地观察自己的相续，并严格地要求自己。如果认真观察，我们会发现，很多事情表面上是利益众生，但实际上都是为了自己。修五加行是为了自己，其他的念咒、放生也是为了自己。简单地说，凡是为了自己的解脱而修行，无论所修的法本身多么殊胜，都只能成为小乘的修法。\u003c/p\u003e\u003cp\u003e如果丝毫没有自私自利的念头，在此基础上去修行的话，哪怕念一句佛号、磕一个头，所修的都是大乘的法。我相信，这些道理很多人也明白，今天如果让你讲你也能讲得头头是道，但无论是出家人还是在家人，真正能做到的却寥若晨星。\u003c/p\u003e\u003cp\u003e本来出家人修行的进步、收获应当远远超过在家人，因为相对来说（不是绝对的），出家人的烦恼要少一些，他们舍弃了很多容易生起烦恼的对境，不会被很多世间的事情所缠绕与侵扰，但出家人里面修行不尽如人意的也不乏其数。\u003c/p\u003e\u003cp\u003e很多人都认为，作为在家人，是很难突破世间重围而专心致志修行的，所以也很难获得解脱。但在如今这个社会里，我们是有办法修行、有办法成就、也有办法解脱的，关键就要看你发心是否真切、正见是否具足。\u003c/p\u003e\u003cp\u003e虽然《大圆满龙钦心髓前行引导文普贤上师言教》（简称《普贤上师言教》）里讲，世间法和出世间法本来就是相违，本来就是矛盾的，因为在家人想完全放下世间的事情去修行，这种机会是很不容易得到的。但是如果能将菩提心融入日常生活的点点滴滴，修大乘的佛法跟处理一些家务事或其他世间的事也不是水火不容的。如果不用处理这些事，当然是很好，但往往在家居士难以做到。释迦牟尼佛对在家人的要求也不是很高，可是，在家人里面同样也有很多成就者。不仅以前有，现在也有。\u003c/p\u003e\u003cp\u003e那我们现在该如何做呢？比如说，虽然平时要上班、要工作，但是同时你可以发慈悲心、出离心，这两个是一点都不矛盾的。平时做一些世间的事情，虽然不是为了利益众生，但我们也有办法将它变成是利益众生的事。\u003c/p\u003e\u003cp\u003e比如说，吃一顿饭究竟是善？是恶？还是不善不恶的无记法呢？如果在不伤害众生生命的前提下，吃饭本身是无记法。但是在《俱舍论》里面讲得很清楚，如果一个人吃完这顿饭，将肚子填饱了以后是为了去杀生、去参战、去行骗等，以这样的目的而吃饭，那吃这顿饭就是造作恶业；如果一个人吃饭的目的，是为了吃饱以后去听法、去放生、去行善，那这个吃饭就是行善；如果他能以菩提心摄持，那么吃这顿饭就成了大乘的修法；如果他吃饭的时候没有什么特殊的目的，没有去想吃完饭以后去杀生、去放生等，那这样的吃饭就是不善不恶，所以叫做无记。\u003c/p\u003e\u003cp\u003e再比如说工作挣钱，为什么要挣钱？如果挣钱是为了利用在修行上，那工作就是出世间法；如果是要拿这些钱去干一些坏事，即使现在还没做，这样的上班天天都是在造恶业；如果没什么其他的想法，只是为了吃饭、生存，这是不善不恶，是无记法。所以，虽然行为相同，却因为当前的发心不同而有善、恶业之区别。\u003c/p\u003e\u003cp\u003e如果自己愿意做的话，行持善法还是很容易的，怎么做都可以。自己不愿意做的话，即使天天给你讲大圆满等最最高深的法，你今天听，明天也听，永远都不去实修，是没有用的，讲了也没有太大意义。闻法很有意义，通过闻法可以明白道理，如果不明白就不知道如何修持，但是如果听了很多却不去实践，这样又有什么意义呢？只能得到一些闻法的功德而已，其他的功德是没有的，在法的实修上也没有什么收获，今年是这个样子，明年还是这样，乃至死亡的时候也是这样空手而去。如果你自己想做、能做的话，仅仅吃一顿饭，都能成为解脱之因。其他类似的修法都是一样。所以，务必要发菩提心。\u003c/p\u003e\u003cp\u003e现在最重要的是什么呢？就是要调整自己的心。为此必须要放弃两个东西，第一是对世间的贪著，也就是留恋轮回，生生世世想做人、天人的企图。为什么要放下呢？如果不放下，我们以后所有的修行都将变成世间法，这对我们来说是一个非常大的障碍，所以一定要放下。\u003c/p\u003e\u003cp\u003e现在为了生存还是要做一些世间的事，尽管这些暂时没有办法放下，但只是权宜之计。如果有从现在起逐渐走向解脱的想法，那就是已经有了出离心，这样，第一个需要放弃的基本上放下来了。\u003c/p\u003e\u003cp\u003e冰冻三尺，非一日之寒。毕竟我们都是凡夫，贪著世间圆满的心要一下子全放下来，绝非一朝一夕之事。但正如上面所讲的那样，无论是修大乘还是小乘的法，只要目的都是为了解脱，有了这样的想法，真实的出离心就可以逐渐地生起来。\u003c/p\u003e\u003cp\u003e第二个必须要放弃的，是只愿利益自己的想法。这种念头必须要放下来，如果放不下，做世间的法是为了自己的利益，出世间的法也是为了自己，那我们就永远无法跨进大乘的门，永远都在大乘的门外徘徊。自己认为是在修大乘法、修密法，如果还是抱着自利的发心，就根本没有趋入大乘的轨道，更谈不上是修密法了，所以我们要放下仅仅利益自己的心。\u003c/p\u003e\u003cp\u003e这样做的难度是非常大的。从无始以来，我们流转轮回直至今天，自利之心一直都与我们紧紧相随，现在让我们放下根深蒂固的积习，并非一朝一夕就能一蹴而就的。但是，如果你想修大乘佛法的话，即使是不容易的事情也一定要去做。不做也可以，但你就没有办法修密法，没有办法修大乘法，你就只能修小乘的法，这个非常重要。这些加行的修法，本来就是所有修法的基础。\u003c/p\u003e\u003cp\u003e一说是基础，很多人就认为这不是很高的法，不是特别重要。这样就理解错了，皮之不存，毛将焉附？在佛法中，所谓基础的法就是一切法的根本，也就是最高的法。\u003c/p\u003e\u003cp\u003e现在很多藏地、汉地的修法者，包括出家人在内，五加行修完了一次就不再修了。五加行是永远都不能离开的修法，绝不是修完一次两次就不用再修了。现在很多人修加行仅仅是在强调数量，而不是强调质量，即使质量达到了要求也还是要修，永远不能停歇。这些修法名义上叫前行、加行，没有冠之以正行之名，实际上却都是正行。所以，愿意解脱，就一定要在前行上多下工夫；不愿意解脱，那就另当别论了。\u003c/p\u003e\u003cp\u003e很多人都有这类问题，加行是用功修了，但只是为了完成一个数量。所以，修密法也好、修五加行也好，做普通的工作也好，我们都必须仔细观察自己的发心是怎样的。\u003c/p\u003e\u003cp\u003e现在到汉地来的活佛也多，有些人今天这里有灌顶，就跑到这个地方去，明天那里有灌顶，他们又跑到那个地方去。很多人都有这样的想法，认为灌了顶以后马上就可以成佛了；还有的认为灌了顶以后肯定就很了不起，从而飘飘然起来。一方面灌顶是很了不起，但是当灌顶流入我们心田的时候，它又变成什么了呢？大多数都变成了世间法。这种情形在藏地有，但在汉地就更为严重。很多出世间的法，本来是非常好的，都当做世间法来修，真令人痛惜！我们每天修法的时间本来就不多，各方面又不那么圆满，如果所修的这点法也都变成世间法，又怎么能不让人哀叹呢？！\u003c/p\u003e\u003cp\u003e希望大家不要把以上所讲的仅仅当做知识来对待。我不是在介绍佛教文化，而是在讲修行要点——什么是修行，修行的时候该怎么做。不是介绍出离心是什么、菩提心是什么，这个你们已经听了很多。但是，在这些细节上的问题做到了没有？做到的恐怕还是很少。如果对世间的贪著和自私之心放不下，即使穿着出家人的衣服也好、有活佛的名号也好、堪布的名号也好，或者自称是居士也好，都仅仅是一个名字而已。如果没有正确的发心，脖子上挂一串念珠是没有用的。如果具有这些正知、正见，那不管你的外表是在家人或出家人都无所谓。\u003c/p\u003e\u003cp\u003e因为你有了非常好的发心，那就如同前面所讲的，连吃饭都可以成为大乘的修法，其他的更不用说了。所以一定要观察，现在我们是修世间法的人，还是修出世间法的人？现在我们是修大乘法的人，还是修小乘法的人？如果时刻提起正念、观照内心，才谈得上是居士、出家人、修行人。如果没有这样做，修行是没有什么意义的。\u003c/p\u003e\u003cp\u003e假如让我们必须按照佛经的要求全部做到，那包括我在内都做不到。但是，我们还是要各尽所能地去做，只要能做还是有很大利益。\u003c/p\u003e\u003cp\u003e我们也许常有这样的念头：虽然实际上我不太愿意发菩提心，只想利益自己，但我不得不发心。因为如果不发菩提心，所做的一切就不能成为大乘法。这就是造作的菩提心。\u003c/p\u003e\u003cp\u003e如果这一世没有真实的菩提心，只有造作的菩提心，那就如阿底峡尊者所说，这一世发造作菩提心的人，下一世就可以度化南瞻部洲那么大世界的众生，他就可以变成这样的一位大菩萨。这是为什么呢？因为发菩提心本身是非常殊胜的修法，因果从来都是不错乱的，所以在他的下一世也会有这样殊胜的果报。\u003c/p\u003e\u003cp\u003e怎样区分造作与不造作呢？比如说，你非常渴的时候想喝水，这是不造作的；在你不想喝水的时候，其他人却勉强你喝，你虽然喝了，但不是出于发自内心的愿望而喝的，这就叫造作。\u003c/p\u003e\u003cp\u003e如果现在不开始做，今生就这样荒废，等到下一世，谁都没有把握再能得到人身，没有把握再能听大乘的佛法，没有把握再遇到大乘的善知识。现在已经有了这个千载难逢的机会，我们一定要抓住不放，一定要去做。不能仅仅去做一些形式上的事，而更要强调实际的、内心的修法，这不论对出家人或在家人都很重要。如果能这样，即使我们没有修大圆满、大手印等甚深密法，但修的至少应该是出世间的法、是大乘的法，这已经很不错了。\u003c/p\u003e\u003cp\u003e很多人自以为已经修过五加行，试问这些人：前面讲的必须放弃的两点，你放下了没有？放下也有很多层次，能多多少少放下一些还是不错的。以前没有修五加行的时候，总是以自利为主，自从修了五加行，利他之心开始增上，那就可以说有了收获。但是，如果修了五加行以后，内心还跟以前一模一样，那修五加行的利益又体现在哪里了呢？\u003c/p\u003e\u003cp\u003e西藏的一些高僧大德有一种说法：如果认真修习，上等的修行者，每天有收获，一天比一天进步；中等的修行者，每个月有收获；下等的修行者，每年有收获。对照自己仔细地观察，在家人没有大的收获还能够理解，因为他们还要处理很多世间琐事，但我们是出家人，没有大的收获就应当自惭形秽了。\u003c/p\u003e\u003cp\u003e如果好好修，经过长期的串习，就会自然而然地产生利益众生的念头。所以我们必须要有正知正见，需要放弃的两点要逐渐地放弃，然后好好地去发菩提心。这是对一个真正的大乘佛教徒的基本要求。\u003c/p\u003e"])</script><script>self.__next_f.push([1,"25:[\"$\",\"$L28\",null,{\"children\":[[\"$\",\"$L12\",null,{\"sx\":{\"position\":\"relative\",\"minHeight\":{\"xs\":0,\"lg\":450,\"xlg\":500,\"xl\":550,\"xxl\":600},\"display\":\"flex\",\"flexDirection\":\"column\"},\"data-reading-container\":true,\"children\":[[\"$\",\"$L29\",null,{\"topicMedia\":[{\"id\":\"2\",\"created\":\"2025-10-14 09:03:06.130Z\",\"courseOrder\":\"1\",\"topicOrder\":\"1\",\"courseTitle\":\"第一册\",\"article_title\":\"三个差别\",\"article_date\":\"2016-05-01 01:00:00.000Z\",\"article_author\":\"作者：慈诚罗珠堪布\",\"article_summary\":\"三个差别，即佛教与外道、世间法与出世间法、大乘与小乘之间的差别。讲述的目的是让我们具备正知正见，放弃对世间的贪著和只愿利益自己的想法，发菩提心。这是对真正的大乘佛教徒的基本要求。\",\"article_fulltext\":\"$2a\",\"article_introtext\":\"\u003cp\u003e这篇文章准备给大家介绍三个内容：第一是佛教和外道的差别；第二是世间法和出世间法的差别；第三是大乘和小乘的差别。\u003c/p\u003e\u003cp\u003e这三个问题说起来比较简单，但不一定人人都十分清楚。对一个想修持正法的人来说，就有必要先了解这三个问题的答案。因为，无论平时行善的时候也好、打坐的时候也好，对这三个问题的不同抉择会带来差异悬殊的结果，所以有必要讲一讲。\u003c/p\u003e\",\"media_author\":\"作者：慈诚罗珠堪布\",\"media_date\":\"2023-04-12 01:00:00.000Z\",\"media_summary\":\"三个差别是佛法的基础知识。本课介绍了学佛三个目标的差别，即外教和佛教的差别、世间法和出世间法的差别、小乘和大乘的差别。突破外道，突破世间法，突破小乘，最后进入大乘解脱道，这才是我们真正的目标。\",\"title\":\"三个差别(2014)\",\"tags\":[\"出离心\",\"初学者\",\"皈依\",\"菩提心\",\"世间法\"],\"url_image\":\"https://d2e6j3zdpz3g2k.cloudfront.net/fhfy/image/jpg/va/L14001.jpg\",\"url_hd\":\"https://d2e6j3zdpz3g2k.cloudfront.net/fhfy/hd/va/2014/L14001_sangechabieer.mp4\",\"url_sd\":\"https://d2e6j3zdpz3g2k.cloudfront.net/fhfy/sd/va/2014/L14001_sangechabieer.mp4\",\"url_ld\":\"htt 磕头等是世间法，而听闻大中观或大圆满等就是出世间法。因为，世间法与出世间法并不是依外相而区分的。\u003c/p\u003e\u003cp\u003e比如向三宝供灯，在同样的供养对境、同样的供养物、同样的供养人的情况下，如果不具备出离心，供灯的发心是为了求得世间的圆满，为了健康长寿、升官发财，或者来世得到人天的福报，这样的供灯就是世间法；反之，如果具备了出离心，供灯的发心是为了求得解脱，而不是为了健康长寿、升官发财，这样的供灯就是出世间法。衡量世间法与出世间法，就是以是否具备出离心为标准的。\u003c/p\u003e\u003cp\u003e大圆满本身是出世间法，可是修大圆满或听大圆满的时候，由于发心的缘故，就有可能把它变成世间法。譬如说，仅仅为了得到一些现世或后世的利益而听大圆满或修大圆满，当此法进入我们的心相续时，它就不是出世间的法，更不是大乘的法。那是什么呢？就是世间法，这叫做“世间法的大圆满”。\u003c/p\u003e\u003cp\u003e放生是什么法呢？那也要看你的发心。即便不是为了得到现世的健康、长寿等，而是为了得到后世的人天果报，或是避免一些后世的灾难，如不堕地狱等三恶道而放生，这种放生也只能成为世间法；如果是为了自己一个人从轮回中得到解脱而放生，这种放生就成了出世间的小乘法；如果是为了拔济一切众生而发誓成佛，为了得到佛的果位而放生，这种放生就是大乘的出世间法；如果在此基础上有一些密宗的见解，这种放生就是密乘的法。\u003c/p\u003e\u003cp\u003e所以，我们一定要审慎思维，并反躬自问：我放生那么多年，到底是为了什么？是不是为了自利？如果是为了一切众生得到佛果而放生，那就可以成为大乘法；如果放生只是希望自己可以长寿，或者下一世转世为人并且健康长寿，或者自己往生净土的话，那这个放生看起来似乎是利益众生，实际上却是在利益自己。\u003c/p\u003e\u003cp\u003e其他修法也应当这样观察。比如到学院或是到其他地方去领受灌顶、听闻佛法，这是世间法还是出世间法呢？和前面讲的一样，如果只是为了自己的健康、长寿，或是为了逃避一些现世或后世身体和精神上的痛苦而听闻修持的话，就同样是世间法。为什么呢？因为你的目的没有离开世间的发心，所以在此基础上所建立的一切都是世间法。\u003c/p\u003e\u003cp\u003e什么叫做出世间法？世间法和出世间法的界限在哪里？出世间法包括大乘和小乘。即使小乘的修行，也必须要有出离心。有了真正的出离心，并在此基础上行善，这种修法就叫做出世间法。\u003c/p\u003e\u003cp\u003e“出离”这两个字的涵义是什么？“出”，就是要放下世间的一切。也就是说，要对世间的任何事物都不留恋，并很清楚地意识到三界六道轮回的痛苦本质，这叫做“出”；“离”就是希求解脱。“出家”中的“出”也是这层含义。“家”是指世间，并不是走出家门、穿上出家僧装就表示出家，而是要对轮回生起真正的厌离心。\u003c/p\u003e\u003cp\u003e在家人学佛、修出离心也是一样，就是要对世间的事物没有任何贪图之心，这叫做“出”。这个“出”外道也有，很多外道的出家人也不愿意在六道中轮回，也希望解脱，但这不叫出离心。真正的出离心，还必须要有一个正确的见解。正确的见解是什么呢？就是首先要意识到轮回的痛苦，所以不再留恋轮回，并努力去寻求解脱、走向解脱。但是，与此同时必须要有解脱的智慧。如果只是一味盲目地、没有智慧地寻求解脱，并不是完整的出离心。出离心的解脱智慧包括小乘的四谛法门，精通四谛之后，才算具备了完整的出离心。\u003c/p\u003e\u003cp\u003e具备了真实无伪的出离心后，所修的一切善法都将成为出世间的法。《俱舍论》里讲，从有了出离心以后，就算是小乘的入道。此处“入道”的意思是指进入小乘次第的第一步。\u003c/p\u003e\u003cp\u003e出离心很重要。人身难得、寿命无常、轮回是苦、因果不虚这些外加行，对增上出离心有很大的帮助。但现在很多所谓的佛教徒，却不愿意修加行，特别是人身难得、寿命无常这些外加行，直接就想修大圆满、大手印等法。这样的人，在藏地的出家人里也有，但在汉地的居士里更多。大圆满、大手印当然是很好的法，但我们现在是不是这样的根器呢？自己现在的心相续调整好了没有？如果没有调整好的话，那么大圆满、大手印是不可能修起来的。\u003c/p\u003e\u003cp\u003e调整的方法又是什么呢？就是修人身难得等修法。对这些修法，我们绝不能等闲视之。阿底峡尊者及以前藏地很多专门修行的高僧大德，他们非常重视人身难得和无常。前辈们已经为我们作出了最好的表率，我们就应当追随他们的足迹。那些不愿修加行，第一步就妄想迈得很高的人，他们离解脱的目的地，也就如同被重重关山阻隔一般，永久难以抵达。\u003c/p\u003e\u003cp\u003e曾经有一位大成就者，当他的一个弟子将要离开的时候，就到上师面前，祈请传一个更殊胜的窍诀。上师说：我并没有什么更殊胜的窍诀。弟子将所有的东西都供养了以后，再一次苦苦祈求，上师就握着弟子的手情真意切地说：“你也将会死的！我也将会死的！这个问题你回去好好思考。我的上师给我讲的也是这个法，我修的也就是这个法，我的上师也没有再给我讲什么，我也没有修过其他什么，这就是窍诀，你回去认真修持吧！”\u003c/p\u003e\u003cp\u003e说起来就是这么简单，你也会死，我也会死。这个不争的事实大家都知道，但是平时却似乎遗忘了。我们每一个人都要深入细致地思维一下这个修法，否则，什么结果也修不出来。\u003c/p\u003e\u003cp\u003e很多人都认为自己肯定在修出世间法，修的是五加行，这怎么不是出世间法呢？五加行本来是出世间的法，而且是大乘的法，但是，在你修持的当下，自相续中是以何等见解来修持的呢？虽然为现世的健康长寿等而修五加行的可能性比较小，但为了后世不堕地狱而修五加行的可能还是有的。如果没有寻求解脱的发心，修五加行也是世间法，而根本不是出世间法。这样一来，修五加行的意义也不是很大。念咒、磕大头是很累的，但如果修出来的不是密法，不是大乘法，也不是小乘法，而成了世间法，就非常令人惋惜。\u003c/p\u003e\u003cp\u003e不少人在法王如意宝前接受过灌顶，看过很多珍贵的书，这非常不容易。如果让它变成世间法，与解脱就没有什么关系了。以后即使会得到一些世间的福报，满足我们鼠目寸光的世间愿望，但与解脱却没有缘分，这岂不是很可惜吗？所以，一定要重视“人身难得”，不能白白地耗尽人生而不求解脱。欲求解脱，就一定要从出离心着手；如果没有出离心，修行也好、念咒也好，都不是获得解脱的出世间法，这个特别特别重要。在出离心的前提下才能讲菩提心，没有如理生起出离心，就不可能生起菩提心。\u003c/p\u003e\u003ch4\u003e三、大乘和小乘的差别\u003c/h4\u003e\u003cp\u003e大乘和小乘的区别是什么呢？就是有没有菩提心。\u003c/p\u003e\u003cp\u003e什么是菩提心？说起来很简单，每个人都会说：为了度化一切众生而发誓成佛，这就是菩提心。但是要付诸行动却并非易事，即使是修行多年的出家人，并自诩为是大圆满的瑜伽士或密法的修行者，有些人也没有真正生起出离心和菩提心。\u003c/p\u003e\u003cp\u003e阿底峡尊者在西藏时，有一次，他和他的弟子在用早餐的时候，尊者忽然说道：“今天，在印度的一个修喜金刚的修行者，已经堕入了声闻的灭定（灭定就是所有的粗分感受及思维都间断。从世间的角度来说，就是进入了一种很清净的状态，并在此状态中保持很长时间）。”尊者的弟子就说：“修喜金刚的行者，有可能堕入声闻的灭定吗？这是什么原因呢？”尊者说：“喜金刚本来是无上密法，但他没有修好，就成了小乘的法，从而堕入此灭定。”所以，判断是大乘的法还是小乘的法，是出世间的法还是世间的法，全都要看自己的发心如何，也就是最初修这些法的目的是什么。\u003c/p\u003e\u003cp\u003e比如说放生，表面上看这是一个利益众生的事，但很多人的希求仅仅是为了自己能避免一些痛苦，或是得到一些现世利益。这样的放生能不能达到其目的呢？目的能够达到。但是，这样的放生不属于大乘的法。因为，他实际上并没有真正利益众生，只是在利益自己而已。\u003c/p\u003e\u003cp\u003e很多人也在精勤不倦地修五加行，如果问他：“为什么修五加行呢？”他会回答说，“不修五加行，大圆满的正行就修不起来”或是“不修五加行，我就不能听大圆满的法”，“所以，我要修五加行”。表面上看来，这样的回答是对的。但如果继续追问：“如果修不成大圆满或听不到大圆满法，又会怎样呢？”“如果是这样，就不容易解脱了。”“解脱了又怎么样呢？”“解脱以后，我就没有痛苦、没有烦恼了。”\u003c/p\u003e\u003cp\u003e如果是这样的发心，则在这种修法里面根本没有菩提心的成分，五加行里所讲的菩提心又在哪里呢？你修的所谓菩提心，只不过是一个十万遍的数量而已，自己心相续中的菩提心却没有真实生起。虽然修的是发菩提心的法，但实际上却是为了自己而修，根本不是真正的菩提心修法。这样一来，你所修的五加行就成了小乘的修法，因为你的菩提心已经完全丧失。\u003c/p\u003e\u003cp\u003e所以，我们在修法的时候要认真地观察自己的相续，并严格地要求自己。如果认真观察，我们会发现，很多事情表面上是利益众生，但实际上都是为了自己。修五加行是为了自己，其他的念咒、放生也是为了自己。简单地说，凡是为了自己的解脱而修行，无论所修的法本身多么殊胜，都只能成为小乘的修法。\u003c/p\u003e\u003cp\u003e如果丝毫没有自私自利的念头，在此基础上去修行的话，哪怕念一句佛号、磕一个头，所修的都是大乘的法。我相信，这些道理很多人也明白，今天如果让你讲你也能讲得头头是道，但无论是出家人还是在家人，真正能做到的却寥若晨星。\u003c/p\u003e\u003cp\u003e本来出家人修行的进步、收获应当远远超过在家人，因为相对来说（不是绝对的），出家人的烦恼要少一些，他们舍弃了很多容易生起烦恼的对境，不会被很多世间的事情所缠绕与侵扰，但出家人里面修行不尽如人意的也不乏其数。\u003c/p\u003e\u003cp\u003e很多人都认为，作为在家人，是很难突破世间重围而专心致志修行的，所以也很难获得解脱。但在如今这个社会里，我们是有办法修行、有办法成就、也有办法解脱的，关键就要看你发心是否真切、正见是否具足。\u003c/p\u003e\u003cp\u003e虽然《大圆满龙钦心髓前行引导文普贤上师言教》（简称《普贤上师言教》）里讲，世间法和出世间法本来就是相违，本来就是矛盾的，因为在家人想完全放下世间的事情去修行，这种机会是很不容易得到的。但是如果能将菩提心融入日常生活的点点滴滴，修大乘的佛法跟处理一些家务事或其他世间的事也不是水火不容的。如果不用处理这些事，当然是很好，但往往在家居士难以做到。释迦牟尼佛对在家人的要求也不是很高，可是，在家人里面同样也有很多成就者。不仅以前有，现在也有。\u003c/p\u003e\u003cp\u003e那我们现在该如何做呢？比如说，虽然平时要上班、要工作，但是同时你可以发慈悲心、出离心，这两个是一点都不矛盾的。平时做一些世间的事情，虽然不是为了利益众生，但我们也有办法将它变成是利益众生的事。\u003c/p\u003e\u003cp\u003e比如说，吃一顿饭究竟是善？是恶？还是不善不恶的无记法呢？如果在不伤害众生生命的前提下，吃饭本身是无记法。但是在《俱舍论》里面讲得很清楚，如果一个人吃完这顿饭，将肚子填饱了以后是为了去杀生、去参战、去行骗等，以这样的目的而吃饭，那吃这顿饭就是造作恶业；如果一个人吃饭的目的，是为了吃饱以后去听法、去放生、去行善，那这个吃饭就是行善；如果他能以菩提心摄持，那么吃这顿饭就成了大乘的修法；如果他吃饭的时候没有什么特殊的目的，没有去想吃完饭以后去杀生、去放生等，那这样的吃饭就是不善不恶，所以叫做无记。\u003c/p\u003e\u003cp\u003e再比如说工作挣钱，为什么要挣钱？如果挣钱是为了利用在修行上，那工作就是出世间法；如果是要拿这些钱去干一些坏事，即使现在还没做，这样的上班天天都是在造恶业；如果没什么其他的想法，只是为了吃饭、生存，这是不善不恶，是无记法。所以，虽然行为相同，却因为当前的发心不同而有善、恶业之区别。\u003c/p\u003e\u003cp\u003e如果自己愿意做的话，行持善法还是很容易的，怎么做都可以。自己不愿意做的话，即使天天给你讲大圆满等最最高深的法，你今天听，明天也听，永远都不去实修，是没有用的，讲了也没有太大意义。闻法很有意义，通过闻法可以明白道理，如果不明白就不知道如何修持，但是如果听了很多却不去实践，这样又有什么意义呢？只能得到一些闻法的功德而已，其他的功德是没有的，在法的实修上也没有什么收获，今年是这个样子，明年还是这样，乃至死亡的时候也是这样空手而去。如果你自己想做、能做的话，仅仅吃一顿饭，都能成为解脱之因。其他类似的修法都是一样。所以，务必要发菩提心。\u003c/p\u003e\u003cp\u003e现在最重要的是什么呢？就是要调整自己的心。为此必须要放弃两个东西，第一是对世间的贪著，也就是留恋轮回，生生世世想做人、天人的企图。为什么要放下呢？如果不放下，我们以后所有的修行都将变成世间法，这对我们来说是一个非常大的障碍，所以一定要放下。\u003c/p\u003e\u003cp\u003e现在为了生存还是要做一些世间的事，尽管这些暂时没有办法放下，但只是权宜之计。如果有从现在起逐渐走向解脱的想法，那就是已经有了出离心，这样，第一个需要放弃的基本上放下来了。\u003c/p\u003e\u003cp\u003e冰冻三尺，非一日之寒。毕竟我们都是凡夫，贪著世间圆满的心要一下子全放下来，绝非一朝一夕之事。但正如上面所讲的那样，无论是修大乘还是小乘的法，只要目的都是为了解脱，有了这样的想法，真实的出离心就可以逐渐地生起来。\u003c/p\u003e\u003cp\u003e第二个必须要放弃的，是只愿利益自己的想法。这种念头必须要放下来，如果放不下，做世间的法是为了自己的利益，出世间的法也是为了自己，那我们就永远无法跨进大乘的门，永远都在大乘的门外徘徊。自己认为是在修大乘法、修密法，如果还是抱着自利的发心，就根本没有趋入大乘的轨道，更谈不上是修密法了，所以我们要放下仅仅利益自己的心。\u003c/p\u003e\u003cp\u003e这样做的难度是非常大的。从无始以来，我们流转轮回直至今天，自利之心一直都与我们紧紧相随，现在让我们放下根深蒂固的积习，并非一朝一夕就能一蹴而就的。但是，如果你想修大乘佛法的话，即使是不容易的事情也一定要去做。不做也可以，但你就没有办法修密法，没有办法修大乘法，你就只能修小乘的法，这个非常重要。这些加行的修法，本来就是所有修法的基础。\u003c/p\u003e\u003cp\u003e一说是基础，很多人就认为这不是很高的法，不是特别重要。这样就理解错了，皮之不存，毛将焉附？在佛法中，所谓基础的法就是一切法的根本，也就是最高的法。\u003c/p\u003e\u003cp\u003e现在很多藏地、汉地的修法者，包括出家人在内，五加行修完了一次就不再修了。五加行是永远都不能离开的修法，绝不是修完一次两次就不用再修了。现在很多人修加行仅仅是在强调数量，而不是强调质量，即使质量达到了要求也还是要修，永远不能停歇。这些修法名义上叫前行、加行，没有冠之以正行之名，实际上却都是正行。所以，愿意解脱，就一定要在前行上多下工夫；不愿意解脱，那就另当别论了。\u003c/p\u003e\u003cp\u003e很多人都有这类问题，加行是用功修了，但只是为了完成一个数量。所以，修密法也好、修五加行也好，做普通的工作也好，我们都必须仔细观察自己的发心是怎样的。\u003c/p\u003e\u003cp\u003e现在到汉地来的活佛也多，有些人今天这里有灌顶，就跑到这个地方去，明天那里有灌顶，他们又跑到那个地方去。很多人都有这样的想法，认为灌了顶以后马上就可以成佛了；还有的认为灌了顶以后肯定就很了不起，从而飘飘然起来。一方面灌顶是很了不起，但是当灌顶流入我们心田的时候，它又变成什么了呢？大多数都变成了世间法。这种情形在藏地有，但在汉地就更为严重。很多出世间的法，本来是非常好的，都当做世间法来修，真令人痛惜！我们每天修法的时间本来就不多，各方面又不那么圆满，如果所修的这点法也都变成世间法，又怎么能不让人哀叹呢？！\u003c/p\u003e\u003cp\u003e希望大家不要把以上所讲的仅仅当做知识来对待。我不是在介绍佛教文化，而是在讲修行要点——什么是修行，修行的时候该怎么做。不是介绍出离心是什么、菩提心是什么，这个你们已经听了很多。但是，在这些细节上的问题做到了没有？做到的恐怕还是很少。如果对世间的贪著和自私之心放不下，即使穿着出家人的衣服也好、有活佛的名号也好、堪布的名号也好，或者自称是居士也好，都仅仅是一个名字而已。如果没有正确的发心，脖子上挂一串念珠是没有用的。如果具有这些正知、正见，那不管你的外表是在家人或出家人都无所谓。\u003c/p\u003e\u003cp\u003e因为你有了非常好的发心，那就如同前面所讲的，连吃饭都可以成为大乘的修法，其他的更不用说了。所以一定要观察，现在我们是修世间法的人，还是修出世间法的人？现在我们是修大乘法的人，还是修小乘法的人？如果时刻提起正念、观照内心，才谈得上是居士、出家人、修行人。如果没有这样做，修行是没有什么意义的。\u003c/p\u003e\u003cp\u003e假如让我们必须按照佛经的要求全部做到，那包括我在内都做不到。但是，我们还是要各尽所能地去做，只要能做还是有很大利益。\u003c/p\u003e\u003cp\u003e我们也许常有这样的念头：虽然实际上我不太愿意发菩提心，只想利益自己，但我不得不发心。因为如果不发菩提心，所做的一切就不能成为大乘法。这就是造作的菩提心。\u003c/p\u003e\u003cp\u003e如果这一世没有真实的菩提心，只有造作的菩提心，那就如阿底峡尊者所说，这一世发造作菩提心的人，下一世就可以度化南瞻部洲那么大世界的众生，他就可以变成这样的一位大菩萨。这是为什么呢？因为发菩提心本身是非常殊胜的修法，因果从来都是不错乱的，所以在他的下一世也会有这样殊胜的果报。\u003c/p\u003e\u003cp\u003e怎样区分造作与不造作呢？比如说，你非常渴的时候想喝水，这是不造作的；在你不想喝水的时候，其他人却勉强你喝，你虽然喝了，但不是出于发自内心的愿望而喝的，这就叫造作。\u003c/p\u003e\u003cp\u003e如果现在不开始做，今生就这样荒废，等到下一世，谁都没有把握再能得到人身，没有把握再能听大乘的佛法，没有把握再遇到大乘的善知识。现在已经有了这个千载难逢的机会，我们一定要抓住不放，一定要去做。不能仅仅去做一些形式上的事，而更要强调实际的、内心的修法，这不论对出家人或在家人都很重要。如果能这样，即使我们没有修大圆满、大手印等甚深密法，但修的至少应该是出世间的法、是大乘的法，这已经很不错了。\u003c/p\u003e\u003cp\u003e很多人自以为已经修过五加行，试问这些人：前面讲的必须放弃的两点，你放下了没有？放下也有很多层次，能多多少少放下一些还是不错的。以前没有修五加行的时候，总是以自利为主，自从修了五加行，利他之心开始增上，那就可以说有了收获。但是，如果修了五加行以后，内心还跟以前一模一样，那修五加行的利益又体现在哪里了呢？\u003c/p\u003e\u003cp\u003e西藏的一些高僧大德有一种说法：如果认真修习，上等的修行者，每天有收获，一天比一天进步；中等的修行者，每个月有收获；下等的修行者，每年有收获。对照自己仔细地观察，在家人没有大的收获还能够理解，因为他们还要处理很多世间琐事，但我们是出家人，没有大的收获就应当自惭形秽了。\u003c/p\u003e\u003cp\u003e如果好好修，经过长期的串习，就会自然而然地产生利益众生的念头。所以我们必须要有正知正见，需要放弃的两点要逐渐地放弃，然后好好地去发菩提心。这是对一个真正的大乘佛教徒的基本要求。\u003c/p\u003e"])</script><script>self.__next_f.push([1,"2c:[\"$\",\"$L20\",null,{\"px\":\"2.666666666666667vmin\",\"sx\":{\"flexGrow\":1,\"display\":\"flex\",\"flexDirection\":\"column\"},\"children\":[\"$\",\"$L30\",null,{\"fullText\":\"$31\",\"articleId\":\"2\",\"articleTitle\":\"三个差别\"}]}]\n2d:[\"$\",\"$L32\",null,{}]\n2e:[\"$\",\"$L33\",null,{\"topicMedia\":\"$25:props:children:0:props:children:0:props:topicMedia:0\"}]\n"])</script><div hidden id="S:3"><div class="MuiBox-root mui-7spen9"><div class="MuiBox-root mui-0"><p class="MuiTypography-root MuiTypography-body1 mui-ywe60o">三个差别</p><div class="MuiBox-root mui-vt4cpd"><div class="MuiStack-root mui-j7qwjs"><p class="MuiTypography-root MuiTypography-body1 mui-zc9mj1">作者：慈诚罗珠堪布<!-- --> / 2016年5月01日</p></div><div class="MuiStack-root mui-puomva"><button class="MuiButtonBase-root MuiButton-root MuiButton-text MuiButton-textPrimary MuiButton-sizeMedium MuiButton-textSizeMedium MuiButton-colorPrimary mui-12pidkm" tabindex="0" type="button"><svg class="MuiSvgIcon-root MuiSvgIcon-fontSizeInherit mui-8pi9ya" focusable="false" aria-hidden="true" viewBox="0 0 24.20263671875 22" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1em" height="1em" fill="currentColor"><path d="M19.2936 21.994C22.0047 21.994 24.2024 19.7962 24.2024 17.0851C24.2024 14.374 22.0047 12.1763 19.2936 12.1763C16.5825 12.1763 14.3848 14.374 14
