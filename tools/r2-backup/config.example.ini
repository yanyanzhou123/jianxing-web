# 见行 / 净土 · R2 整桶备份配置
# 复制本文件为 config.ini 后填写（不要把填好的 config.ini 传到公开地方）

# Cloudflare 账号 ID（R2 概览页右侧 / 或 API Token 创建页可见）
account_id=

# R2 API Token 的 Access Key ID / Secret Access Key
# 创建位置：Cloudflare Dashboard → R2 → Overview → Manage R2 API Tokens → Create API token
# 权限勾选 Object Read（只读备份足够）
access_key_id=
secret_access_key=

# 要备份的桶名（见行默认 jianxing-files；净土改为 jingtu-files）
bucket=jianxing-files

# 备份到本机的文件夹（不存在会自动创建）
local_dir=D:\backup\jianxing-files
